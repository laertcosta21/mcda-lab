[theme]
base = "light"
primaryColor = "#1B5A72"
backgroundColor = "#F4F6F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18242A"
linkColor = "#1B5A72"
borderColor = "#D3DCDF"
showWidgetBorder = true
baseRadius = "6px"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap, monospace"

[theme.sidebar]
backgroundColor = "#FAFBFB"
secondaryBackgroundColor = "#FFFFFF"

[client]
toolbarMode = "minimal"
