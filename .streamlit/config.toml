[theme]
base = "light"
primaryColor = "#0068C9"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#31333F"
linkColor = "#0068C9"
borderColor = "#D5D9E0"
showWidgetBorder = true
baseRadius = "8px"
baseFontSize = 15
font = "'Work Sans':https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap, sans-serif"

[theme.sidebar]
backgroundColor = "#1E293B"
secondaryBackgroundColor = "#334155"
textColor = "#F1F5F9"
borderColor = "#475569"

[client]
toolbarMode = "minimal"
